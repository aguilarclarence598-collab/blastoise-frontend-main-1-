<!doctype html>
<!-- cspell:disable -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#28263f" />
<title>Patient dashboard | Blastoise</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--navy:#28263f;--teal:#2ba6ae;--mint:#eaf5f4;--bg:#f4f5f7;--line:#e6e8ec;--muted:#7a7f90;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.5 'DM Sans',system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:32px 24px 120px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(28px,4vw,38px);font-weight:600;letter-spacing:-.02em}
.sub{margin:8px 0 0;color:var(--muted)}
.tools{display:flex;gap:10px;align-items:center}
.badge{padding:5px 12px;border-radius:999px;background:#fdf1d3;color:#8a6511;font-size:13px}
.ghost{padding:9px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:inherit;cursor:pointer;transition:background .2s}
.ghost:hover{background:var(--bg)}
.grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;margin-top:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.main{display:grid;gap:20px;min-width:0}
.muted{color:var(--muted)}.pad{padding:16px 20px;margin:0}

/* animations */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.reveal{animation:rise .65s var(--ease) both;animation-delay:calc(var(--i,0)*80ms)}

/* patient list */
.list{padding:12px;display:grid;gap:4px;position:sticky;top:16px}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:10px;color:var(--muted);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(43,166,174,.15)}
.search input{flex:1;border:0;outline:0;padding:11px 0;font:inherit;background:none;color:var(--navy)}
.item{display:flex;gap:12px;align-items:center;padding:10px;border:0;border-radius:10px;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .2s,transform .25s var(--ease)}
.item:hover{background:var(--bg);transform:translateX(4px)}
.item.active{background:var(--mint)}
.item small{display:block;color:var(--muted)}
.item:focus-visible,.fab button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.av{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--mint);color:#1d7c82;font-size:12px;font-weight:600;flex:none}
.av.lg{width:64px;height:64px;font-size:20px}

/* profile */
.profile{display:flex;gap:20px;padding:24px}
.profile h2{margin:0;font-size:24px;font-weight:600}
.ptop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.facts{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 20px;color:var(--muted)}
.facts li{display:flex;align-items:center;gap:8px}

/* stats */
.stats{display:grid;grid-template-columns:130px repeat(3,1fr);align-items:center;background:var(--mint);border-color:#d6ebe8}
.stats>div{padding:20px 24px;display:grid;gap:6px}
.stats>div+div{border-left:1px solid #d6ebe8}
.stats span{font-size:13px;color:var(--muted)}
.stats strong{font-size:25px;font-weight:600}
.stats strong.warn{color:#b5651d}
.ring-wrap{position:relative;width:92px;height:92px;margin:auto;padding:0!important}
.ring{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9}
.ring-bg{stroke:#cfe6e3}
.ring-fg{stroke:var(--teal);stroke-linecap:round;stroke-dasharray:251.3;stroke-dashoffset:251.3;transition:stroke-dashoffset 1.1s var(--ease) .35s}
.ring-wrap b{position:absolute;inset:0;display:grid;place-items:center;font-weight:600}

/* tables */
.chead{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.chead h3{margin:0;font-size:17px;font-weight:600}
.count{padding:2px 8px;border-radius:6px;background:var(--mint);font-size:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:12px 20px;font-size:12px;font-weight:500;color:var(--muted);background:#fafbfc}
td{padding:14px 20px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{transition:background .2s}tbody tr:hover{background:#fafcfc}
.pill{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500}
.active-p,.paid{background:#e1f4e8;color:#23764a}
.follow_up,.pending{background:#fdf1d3;color:#8a6511}
.overdue{background:#fde4e1;color:#b13b2e}
.inactive{background:#eceef2;color:#626879}
.triage{padding:16px 20px;border-top:1px solid var(--line)}
.triage:first-of-type{border-top:0}.triage p{margin:0 0 4px}.triage small{color:var(--muted)}
.errbox{padding:12px 16px;border-radius:10px;background:#fdecec;color:#a73636}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:340px;padding:32px;display:grid;gap:14px;animation:rise .7s var(--ease) both}
.login h2{margin:0;font-size:26px}
input,select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--navy);background:#fff;width:100%}
input:focus,select:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(43,166,174,.15)}
.primary{padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.primary:hover{transform:translateY(-2px);background:#37345a}
.err{margin:0;color:#b13b2e;font-size:14px;min-height:1em}

/* floating action button */
.fab{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:12px;z-index:20}
.fab-menu{display:grid;gap:10px;justify-items:end}
.fab-act{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;color:var(--navy);cursor:pointer;box-shadow:0 6px 18px rgba(40,38,63,.15);opacity:0;transform:translateY(18px) scale(.9);pointer-events:none;transition:opacity .25s,transform .35s var(--ease),background .2s;transition-delay:calc(var(--n)*50ms)}
.fab-act i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--mint);color:#1d7c82}
.fab-act:hover{background:var(--mint)}
.fab.open .fab-act{opacity:1;transform:none;pointer-events:auto}
@keyframes ring{0%{box-shadow:0 8px 24px rgba(40,38,63,.35),0 0 0 0 rgba(43,166,174,.55)}70%,100%{box-shadow:0 8px 24px rgba(40,38,63,.35),0 0 0 18px rgba(43,166,174,0)}}
.fab-main{display:grid;place-items:center;width:60px;height:60px;border:0;border-radius:50%;background:var(--navy);color:#fff;cursor:pointer;animation:ring 2.8s infinite;transition:transform .35s var(--ease),background .2s}
.fab-main:hover{background:#37345a;transform:scale(1.07)}
.fab.open .fab-main{transform:rotate(135deg);background:var(--teal);animation:none;box-shadow:0 8px 24px rgba(40,38,63,.35)}

/* modal + toast */
dialog{border:0;border-radius:16px;padding:0;width:min(400px,92vw);color:var(--navy);box-shadow:0 20px 60px rgba(40,38,63,.35)}
dialog[open]{animation:pop .3s var(--ease)}
dialog::backdrop{background:rgba(40,38,63,.45);animation:fade .3s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
dialog form{padding:26px;display:grid;gap:14px}
dialog h3{margin:0;font-size:20px}
dialog label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.mact{display:flex;justify-content:flex-end;gap:10px}.mact .primary{padding:10px 20px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);padding:12px 20px;border-radius:12px;background:var(--navy);color:#fff;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease);z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
 .wrap{padding:20px 16px 120px}
 .grid{grid-template-columns:1fr}.list{position:static}
 .stats{grid-template-columns:1fr 1fr}
 .stats>div+div{border-left:0}.profile{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form class="card" id="loginForm">
    <h2>Blastoise</h2>
    <p class="muted" style="margin:0">Log in to your clinic workspace.</p>
    <input id="email" type="email" placeholder="Email" required autocomplete="email" />
    <input id="password" type="password" placeholder="Password" required autocomplete="current-password" />
    <p class="err" id="loginErr"></p>
    <button class="primary">Log in</button>
  </form>
</section>

<main class="wrap" id="app" hidden>
  <div class="top reveal">
    <div>
      <p class="eyebrow">Clinic management</p>
      <h1>Patient dashboard</h1>
      <p class="sub">See a patient’s details, billing, and recent triage in one place.</p>
    </div>
    <div class="tools">
      <span class="badge" id="badge" hidden>Demo data</span>
      <button class="ghost" id="logout" hidden>Log out</button>
    </div>
  </div>

  <div class="grid">
    <aside class="card list reveal" style="--i:1">
      <label class="search"><span data-ic="search"></span><input id="q" placeholder="Search patients" aria-label="Search patients" /></label>
      <div id="list" style="display:grid;gap:4px"></div>
    </aside>
    <div class="main" id="detail"></div>
  </div>
</main>

<div class="fab" id="fab">
  <div class="fab-menu">
    <button class="fab-act" style="--n:0" data-kind="invoice"><span>Create invoice</span><i data-ic="file" data-s="18"></i></button>
    <button class="fab-act" style="--n:1" data-kind="patient"><span>Add patient</span><i data-ic="userplus" data-s="18"></i></button>
  </div>
  <button class="fab-main" id="fabBtn" aria-label="Quick actions" aria-expanded="false"><span data-ic="plus" data-s="26"></span></button>
</div>

<dialog id="modal">
  <form id="form">
    <h3 id="mtitle"></h3>
    <div id="mfields" style="display:grid;gap:14px"></div>
    <p class="err" id="merr"></p>
    <div class="mact"><button type="button" class="ghost" id="mcancel">Cancel</button><button class="primary">Save</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ====== Paste your project URL and publishable (anon) key below. Leave them blank to use demo data. ====== */
const SUPABASE_URL = ''
const SUPABASE_KEY = ''
/* ====================================================================================================================== */

const demo = !SUPABASE_URL || !SUPABASE_KEY
const sb = demo ? null : supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
const $ = (s) => document.querySelector(s)
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const peso = (n) => new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(n || 0)
const fmt = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'No visit yet'
const initials = (n = '') => n.split(' ').map((w) => w[0]).slice(0, 2).join('').toUpperCase()
const PS = { active: 'Active', follow_up: 'Follow-up', inactive: 'Inactive' }
const IS = { paid: 'Paid', pending: 'Pending', overdue: 'Overdue' }

const I = {
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
  userplus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
  id: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
}
const ic = (k, s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`
document.querySelectorAll('[data-ic]').forEach((el) => (el.innerHTML = ic(el.dataset.ic, +el.dataset.s || 16)))

/* ---------- Data layer: Supabase o demo ---------- */
const demoDb = {
  patients: [
    { id: 'p1', patient_code: 'PT-1024', full_name: 'Sofia Reyes', phone: '0917 000 1024', last_visit: '2026-10-08', status: 'active', doctors: null },
    { id: 'p2', patient_code: 'PT-1023', full_name: 'Miguel Santos', phone: '0917 000 1023', last_visit: '2026-10-07', status: 'active', doctors: null },
    { id: 'p3', patient_code: 'PT-1022', full_name: 'Isabella Cruz', phone: '0917 000 1022', last_visit: '2026-10-06', status: 'follow_up', doctors: null },
  ],
  invoices: [
    { id: 'i1', patient_id: 'p1', invoice_no: 'INV-2026-041', issued_date: '2026-10-08', amount: 1250, status: 'paid' },
    { id: 'i2', patient_id: 'p2', invoice_no: 'INV-2026-040', issued_date: '2026-10-07', amount: 750, status: 'pending' },
    { id: 'i3', patient_id: 'p3', invoice_no: 'INV-2026-039', issued_date: '2026-10-06', amount: 1850, status: 'overdue' },
  ],
}
async function clinicId() {
  const { data: { user } } = await sb.auth.getUser()
  const { data, error } = await sb.from('profiles').select('clinic_id').eq('id', user.id).single()
  if (error) throw error
  return data.clinic_id
}
const api = {
  async patients() {
    if (demo) return demoDb.patients
    const { data, error } = await sb.from('patients').select('*, doctors(full_name, specialty)').order('last_visit', { ascending: false })
    if (error) throw error
    return data
  },
  async invoices(id) {
    if (demo) return demoDb.invoices.filter((i) => i.patient_id === id)
    const { data, error } = await sb.from('invoices').select('*').eq('patient_id', id).order('issued_date', { ascending: false })
    if (error) throw error
    return data
  },
  async triage(id) {
    if (demo) return []
    const { data } = await sb.from('triage_records').select('*').eq('patient_id', id).order('created_at', { ascending: false }).limit(3)
    return data || []
  },
  async addPatient(v) {
    if (demo) {
      const row = { id: 'p' + Date.now(), patient_code: 'PT-' + (1025 + demoDb.patients.length - 3), full_name: v.full_name, phone: v.phone || null, last_visit: null, status: 'active', doctors: null }
      demoDb.patients.unshift(row)
      return row
    }
    const { data, error } = await sb.from('patients').insert({ clinic_id: await clinicId(), full_name: v.full_name, phone: v.phone || null }).select().single()
    if (error) throw error
    return data
  },
  async addInvoice(pid, v) {
    const today = new Date().toISOString().slice(0, 10)
    if (demo) {
      demoDb.invoices.unshift({ id: 'i' + Date.now(), patient_id: pid, invoice_no: 'INV-2026-0' + (42 + demoDb.invoices.length - 3), issued_date: today, amount: +v.amount, status: v.status })
      demoDb.patients.find((p) => p.id === pid).last_visit = today
      return
    }
    const { error } = await sb.from('invoices').insert({ clinic_id: await clinicId(), patient_id: pid, amount: +v.amount, status: v.status })
    if (error) throw error
  },
}

/* ---------- Render ---------- */
let patients = [], selected = null

function renderList() {
  const q = $('#q').value.trim().toLowerCase()
  const rows = patients.filter((p) => p.full_name.toLowerCase().includes(q) || p.patient_code.toLowerCase().includes(q))
  $('#list').innerHTML = rows.length
    ? rows.map((p) => `<button class="item${p.id === selected ? ' active' : ''}" data-id="${p.id}"><span class="av">${initials(p.full_name)}</span><span><strong>${esc(p.full_name)}</strong><small>${esc(p.patient_code)}</small></span></button>`).join('')
    : '<p class="muted pad">No patients found.</p>'
}

function countUp(el, to) {
  if (reduce || !to) { el.textContent = peso(to); return }
  const t0 = performance.now()
  const step = (t) => {
    const k = Math.min((t - t0) / 900, 1)
    el.textContent = peso(to * (1 - Math.pow(1 - k, 3)))
    if (k < 1) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}

async function renderDetail() {
  const box = $('#detail')
  const p = patients.find((x) => x.id === selected)
  if (!p) { box.innerHTML = '<p class="muted">No patients yet. Use the + button to add one.</p>'; return }
  const [inv, tri] = await Promise.all([api.invoices(p.id), api.triage(p.id)])
  if (p.id !== selected) return
  const billed = inv.reduce((s, i) => s + Number(i.amount), 0)
  const paid = inv.filter((i) => i.status === 'paid').reduce((s, i) => s + Number(i.amount), 0)
  const out = billed - paid
  const pct = billed ? Math.round((paid / billed) * 100) : 0
  const doc = p.doctors ? `${esc(p.doctors.full_name)} (${esc(p.doctors.specialty)})` : 'No doctor assigned'

  box.innerHTML = `
  <div class="card profile reveal" style="--i:0">
    <span class="av lg">${initials(p.full_name)}</span>
    <div>
      <div class="ptop"><h2>${esc(p.full_name)}</h2><span class="pill ${p.status === 'active' ? 'active-p' : p.status}">${PS[p.status]}</span></div>
      <ul class="facts">
        <li>${ic('id', 15)} ${esc(p.patient_code)}</li>
        <li>${ic('phone', 15)} ${esc(p.phone || 'No phone')}</li>
        <li>${ic('cal', 15)} Last visit: ${fmt(p.last_visit)}</li>
        <li>${ic('user', 15)} ${doc}</li>
      </ul>
    </div>
  </div>
  <div class="card stats reveal" style="--i:1">
    <div class="ring-wrap"><svg class="ring" viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="40"/><circle class="ring-fg" cx="50" cy="50" r="40"/></svg><b>${pct}%</b></div>
    <div><span>Total billed</span><strong data-n="${billed}">${peso(billed)}</strong></div>
    <div><span>Collected</span><strong data-n="${paid}">${peso(paid)}</strong></div>
    <div><span>Outstanding</span><strong class="${out > 0 ? 'warn' : ''}" data-n="${out}">${peso(out)}</strong></div>
  </div>
  <div class="card reveal" style="--i:2">
    <div class="chead"><h3>Invoices</h3><span class="count">${inv.length}</span></div>
    ${inv.length ? `<div class="scroll"><table><thead><tr><th>Invoice</th><th>Issued</th><th>Amount</th><th>Status</th></tr></thead><tbody>${inv.map((i) => `<tr><td>${esc(i.invoice_no)}</td><td>${fmt(i.issued_date)}</td><td><strong>${peso(i.amount)}</strong></td><td><span class="pill ${i.status}">${IS[i.status]}</span></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted pad">No invoices yet. Use the + button to create one.</p>'}
  </div>
  <div class="card reveal" style="--i:3">
    <div class="chead"><h3>Recent triage</h3></div>
    ${tri.length ? tri.map((t) => `<div class="triage"><p>${esc(t.symptoms)}</p><small>${t.urgency ? 'Urgency: ' + esc(t.urgency) : 'Urgency not set'}${t.suggested_specialty ? ' · Suggested: ' + esc(t.suggested_specialty) : ''}</small></div>`).join('') : '<p class="muted pad">No triage notes yet.</p>'}
  </div>`

  box.querySelectorAll('[data-n]').forEach((el) => countUp(el, +el.dataset.n))
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const r = box.querySelector('.ring-fg')
    if (r) r.style.strokeDashoffset = 251.3 * (1 - pct / 100)
  }))
}

async function loadPatients() {
  try {
    patients = await api.patients()
    if (!patients.some((p) => p.id === selected)) selected = patients[0]?.id ?? null
    renderList()
    await renderDetail()
  } catch (e) {
    $('#detail').innerHTML = `<p class="errbox">Could not load patients: ${esc(e.message)}</p>`
  }
}

/* ---------- Events ---------- */
$('#list').addEventListener('click', (e) => {
  const b = e.target.closest('.item')
  if (!b) return
  selected = b.dataset.id
  renderList()
  renderDetail()
})
$('#q').addEventListener('input', renderList)

const fab = $('#fab')
const setFab = (open) => { fab.classList.toggle('open', open); $('#fabBtn').setAttribute('aria-expanded', open) }
$('#fabBtn').addEventListener('click', () => setFab(!fab.classList.contains('open')))
document.addEventListener('click', (e) => { if (!fab.contains(e.target)) setFab(false) })
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setFab(false) })
fab.querySelectorAll('.fab-act').forEach((b) => b.addEventListener('click', () => openModal(b.dataset.kind)))

let kind = ''
function openModal(k) {
  setFab(false)
  const p = patients.find((x) => x.id === selected)
  if (k === 'invoice' && !p) return toast('Select a patient first')
  kind = k
  $('#merr').textContent = ''
  $('#mtitle').textContent = k === 'patient' ? 'Add patient' : 'Create invoice for ' + p.full_name
  $('#mfields').innerHTML = k === 'patient'
    ? '<label>Full name<input name="full_name" required autofocus /></label><label>Phone<input name="phone" placeholder="0917 000 0000" /></label>'
    : '<label>Amount (PHP)<input name="amount" type="number" min="0" step="0.01" required autofocus /></label><label>Status<select name="status"><option value="pending">Pending</option><option value="paid">Paid</option><option value="overdue">Overdue</option></select></label>'
  $('#modal').showModal()
}
$('#mcancel').addEventListener('click', () => $('#modal').close())
$('#form').addEventListener('submit', async (e) => {
  e.preventDefault()
  const v = Object.fromEntries(new FormData(e.target))
  try {
    if (kind === 'patient') { selected = (await api.addPatient(v)).id; toast('Patient added') }
    else { await api.addInvoice(selected, v); toast('Invoice created') }
    $('#modal').close()
    await loadPatients()
  } catch (err) { $('#merr').textContent = err.message }
})

let tt
function toast(msg) {
  const t = $('#toast')
  t.textContent = msg
  t.classList.add('show')
  clearTimeout(tt)
  tt = setTimeout(() => t.classList.remove('show'), 2400)
}

/* ---------- Start ---------- */
function start() {
  $('#login').hidden = true
  $('#app').hidden = false
  loadPatients()
}
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault()
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value, password: $('#password').value })
  if (error) $('#loginErr').textContent = error.message
  else start()
})
$('#logout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload() })

;(async function init() {
  if (demo) { $('#badge').hidden = false; return start() }
  $('#logout').hidden = false
  const { data } = await sb.auth.getSession()
  if (data.session) start()
  else $('#login').hidden = false
})()
</script>
</body>
</html>
